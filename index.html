<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GetYourTabs</title>
  <link rel="stylesheet" href="./styles/styles.css">
  <link rel="stylesheet" href="./styles/accessories/header.css">
  <link rel="stylesheet" href="./styles/accessories/footer.css">
  <link rel="stylesheet" href="./styles/accessories/scroll-top-btn.css">
  <link rel="stylesheet" href="./styles/search.css">
</head>

<body>

  <div id="header-placeholder"></div>
  <div id="scroll-top-placeholder"></div>

  <main class="page-content">
    <h2>Search Guitar Tabs</h2>
    <div class="search-block">
      <div class="search-container">
        <input type="text" id="search" placeholder="Song, Artist, Difficulty...">
        <button id="clear-btn">Clear</button>
      </div>

      <div class="search-page bottom-btns">
        <!-- <a href="./pages/see-tabs.html" class="see-tabs-btn">
          <button id="see-tabs-btn">See all tabs</button>
        </a> -->
        <button id="change-songs-display-btn" class="search-page change-songs-display-btn">
          <img src="./assets/icons/song-icon-1.svg" alt="song icon">
        </button>
        <button id="youtube-btn" class="search-page youtube-btn">
          <img src="./assets/icons/ytb-logo-1.svg" alt="youtube logo">
        </button>
        <button id="guitar-type-btn" class="search-page guitar-type-btn">
          <img src="./assets/icons/guitar-icon-1.svg" alt="guitar icon">
        </button>
        <button id="metronome-btn" class="search-page metronome-btn">
          <img src="./assets/icons/metronome-1.svg" alt="metronome icon">
        </button>
      </div>
    </div>

    <div id="iframes-container"></div>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module" src="./js/searchTabs.js"></script>
  <script src="./js/accessories/header.js"></script>
  <script src="./js/accessories/footer.js"></script>
  <script src="./js/buttons/scrollToTop.js"></script>
  <script src="./js/buttons/darkMode.js"></script>
  <script src="./js/buttons/metronome.js"></script>
  <script src="./js/buttons/guitarFilter.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetYourTabs</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/tuner.css">
    <link rel="stylesheet" href="../styles/accessories/header.css">
    <link rel="stylesheet" href="../styles/accessories/footer.css">

</head>

<body>
    <div id="header-placeholder"></div>

    <main class="page-content">
        <div id="header-placeholder"></div>
        <h2>Online Tuner</h2>

        <div class="tuner-page search-block">
            <button id="startbtn" class="">
                <img src="../assets/icons/tuner-1.svg" alt="tuner icon">
            </button>

            <div id="output">
                <div class="text-block">
                    <h4 id="note">Note: --</h4>
                    <h4 id="freq">Frequency: -- Hz</h4>
                </div>
                <div class="gauge">
                    <div id="needle"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../js/tuner.js"></script>
    <script src="../js/accessories/header.js"></script>
    <script src="../js/accessories/footer.js"></script>
    <script src="../js/buttons/darkMode.js"></script>

</body>

</html>
